<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>نظرات کاربران</title>

    <style>

        body {
            font-family: sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .comments-container {
            max-width: 800px;
            margin: auto;
        }

        .comment-form {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .comment-form textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .comment-form button {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .comment {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .comment-user {
            font-weight: bold;
        }

        .comment-date {
            color: #777;
            font-size: 13px;
        }

        .comment-text {
            line-height: 1.8;
        }

        .no-comments {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            color: #777;
        }

    </style>
</head>

<body>

<div class="comments-container">

    <h1>نظرات کاربران</h1>

    <!-- فرم ارسال نظر -->

    <div class="comment-form">

        <h2>نظر خود را بنویسید</h2>

        <form action="{{ url_for('comments') }}" method="POST"  >
            <textarea  name="comment" placeholder="نظر خود را بنویسید..."  required  ></textarea>
            <button type="submit">  ارسال نظر  </button>
        </form>

    </div>


    <!-- نمایش نظرات -->

    <h2>نظرات کاربران</h2>

    {% if comments %}

        {% for comment in comments %}

            <div class="comment">

                <div class="comment-header">

                    <span class="comment-user">
                        {{ comment.user.first_name }}
                        {{ comment.user.last_name }}
                    </span>

                    <span class="comment-date">
                        {{ comment.created_at }}
                    </span>

                </div>

                <div class="comment-text">
                    {{ comment.comment }}
                </div>

            </div>

        {% endfor %}

    {% else %}

        <div class="no-comments">
            هنوز نظری ثبت نشده است.
        </div>

    {% endif %}

</div>

</body>
</html>
