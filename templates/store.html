<!DOCTYPE html>
<html dir="ltr">

<head>
    <title>Tina Shop</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/store.css') }}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<header>

    <div class="topbar">

        <div class="navbar-fixed">
            <h1 class="logo">Tina Shop</h1>
        </div>

        <nav class="top-links">
            <a href="{{ url_for('a_me') }}">About Us</a>
            <a href="./places.html">Other Places</a>
        </nav>

        <div class="search-box">
            <input type="text" placeholder="Search product...">
            <button>Search</button>
        </div>

        <div class="phone">
            <label>Phone:</label>

            <select>
                <option>09999999999</option>
                <option>09123456789</option>
            </select>
        </div>

    </div>

</header>


<!-- ================= HERO ================= -->

<section class="hero">

    <p class="hero-small">WELCOME TO</p>

    <h2>Tina Shop</h2>

    <p class="hero-text">
        Find your favorite products in one place.
    </p>

</section>


<!-- ================= BUTTONS ================= -->

<div class="buttons">

    <a href="{{ url_for('signup') }}">Sign In</a>

    <a href="{{ url_for('login') }}">Log In</a>

    <a href="{{ url_for('show_products') }}">Show Products</a>

    <a href="{{ url_for('show_cart') }}">Your Cart</a>

    <a href="#">Conversation</a>

    <a href="{{ url_for('admin_login') }}">
        Admin Panel
    </a>

</div>


</body>

</html>
