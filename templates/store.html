<!DOCTYPE html>
<html dir="rtl">

<head>
    <title>Tina Shop</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/store.css') }}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

 <script>

        function openSidebar() {

            document
                .getElementById("shopSidebar")
                .classList.add("open");

            document
                .getElementById("sidebarOverlay")
                .classList.add("open");

        }


        function closeSidebar() {

            document
                .getElementById("shopSidebar")
                .classList.remove("open");

            document
                .getElementById("sidebarOverlay")
                .classList.remove("open");

        }

    </script>

<body>

<header>

    <div class="topbar">

        <div class="navbar_fixed">
            <button
                class="menu-button"
                type="button"
                onclick="openSidebar()"
            >
                ☰
            </button>

        </div>

        <div class="navbar-fixed">
            <h1 class="logo">Tina Shop</h1>
        </div>

        <nav class="top-links">
            <a href="{{ url_for('a_me') }}">در مورد من</a>
            <a href="./places.html">شعبه های دیگر</a>
        </nav>

        <div class="search-box">
            <input type="text" placeholder="جستجو کنید">
            <button>جستجو</button>
        </div>

        <div class="phone">
            <label>شماره تلفن</label>

            <select>
                <option>09999999999</option>
                <option>09123456789</option>
            </select>
        </div>

    </div>

</header>


<!-- ================= HERO ================= -->

<section class="hero">

    <p class="hero-small">خوش آمدید به</p>

    <h2>Tina Shop</h2>

    <p class="hero-text">
        تمامی محصولات مورد نیازت را در یک مکان پیدا کن
    </p>

</section>


<!-- ================= BUTTONS ================= -->

<div class="buttons">

    <a href="{{ url_for('signup') }}">ثبت نام </a>

    <a href="{{ url_for('login') }}">ورود</a>

    <a href="{{ url_for('show_products') }}">نمایش محصولات</a>

    <a href="{{ url_for('show_cart') }}">سبد خرید</a>

    <a href="{{ url_for('comments') }}">نظرات</a>

    <a href="{{ url_for('admin_login') }}">
        ادمین پنل
    </a>

</div>


</body>
<!-- =========================
    Sidebar
========================= -->

<aside id="shopSidebar" class="shop-sidebar">


    <!-- Sidebar Header -->

    <div class="sidebar-header">

        <h2>
            Tina Shop
        </h2>

        <button
            type="button"
            class="close-sidebar"
            onclick="closeSidebar()"
        >
            ×
        </button>

    </div>



    <!-- Sidebar Links -->

    <nav class="sidebar-menu">


        <a href="{{ url_for('index') }}">
            🏠
            <span>صفحه اصلی</span>
        </a>


        <a href="{{ url_for('show_cart') }}">
            🛒
            <span>سبد خرید</span>
        </a>


        <a href="{{ url_for('comments') }}">
            💬
            <span>نظرات</span>
        </a>


        <a href="{{ url_for('signup') }}">
            👤
            <span>ثبت نام</span>
        </a>


        <a href="{{ url_for('login') }}">
            🔑
            <span>ورود</span>
        </a>

        <a href="{{ url_for('admin_login') }}">
            👨‍💻
            <span>ادمین پنل</span>
        </a>


    </nav>


</aside>



<!-- لایه تاریک پشت منو -->

<div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

</html>
