<!DOCTYPE html>
<html dir="rtl">

<head>
    <title>Tina Shop admin sign in </title>
    <!-- <link rel="stylesheet" href="/static/css/signin.css"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/signin.css') }}">

    <meta name="viewport" content="with=device-width , initial-scale=1.0">
</head>

<body>
    <div class="container">
        <h2 class="title">ثبت نام کردن </h2>

        <form action="/admin_register" method="POST" class="add-form">

            <div class="form-group">
                <input class="ph" type="text" name="name" placeholder="نام خود را وارد کنید" required>
            </div>

            <div class="form-group">
                <input class="ph" type="text" name="LastName" placeholder="نام خانوادگی خود را وارد کنید" required>
            </div>

            <div class="form-group">
                <input class="ph" type="text" name="phoneEmail" placeholder="شماره ی موبایل یا ایمل فعال خود را وارد کنید" required>
            </div>

            <div class="form-group">
                <input class="ph" type="text"name="userName" placeholder="نام کاربری خود را وارد کنید" required>
            </div>

            <div class="form-group">
                <input class="ph" type="password" name="password" placeholder="رمز عبور خود را وارد کنید" required>

            </div>

            <div class="form-group">
                <select name="role" id="role">
                    <option value="user">کاربر عادی</option>
                    <option value="product_admin">ادمین محصولات</option>
                    <option value="user_admin">ادمین کاربران</option>
                </select>

            </div>

            <button type="submit" class="button">ثبت کاربر</button>
        </form>
    </div>
</body>

</html>
