<!DOCTYPE html>
<html dir="ltr">

<head>
    <title>Tina Shop admin dashboard</title>
    <!-- <link rel="stylesheet" href="/static/css/add_product.css"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/add_product.css') }}">

    <meta name="viewport" content="with=device-width , initial-scale=1.0">
</head>

<body>
    <div class="container">
        <h2 class="title">افزودن محصول جدید به فروشگاه</h2>

        <form action="/add_product" method="POST" enctype="multipart/form-data" class="add-form">

            <div class="form-group">
                <label>نام محصول :</label>
                <input class="ph" type="text" name="name" placeholder="نام محصول را وارد کنید" required>
            </div>

            <div class="form-group">
                <label>قیمت محصول :</label>
                <input class="ph" type="text" name="price" placeholder="قیمت محصول را به تومان وارد کنید" required>
            </div>

            <div class="form-group">
                <label>توضیحات :</label>
                <textarea class="ph" name="discription" rows="4" placeholder="توضیحات مربوط به محصول را وارد کنید" required></textarea>
            </div>

            <div class="form-group">
                <label>عکس محصول :</label>
                <input class="ph" type="file" name="image" required>
            </div>
            <button type="submit" class="button">ثبت محصول</button>
        </form>
    </div>
</body>

</html>
