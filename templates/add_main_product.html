
<body>
    
    <div class="container">
        <h2 class="title">افزودن محصول اصلی</h2>

        <form action="/add_main_product" method="POST" onsubmit="submitForm(event, this)" class="add-form">

            <div class="form-group">
                <input class="ph" type="text" name="name" placeholder="نام دسته ی اصلی محصول را وارد کنید" required>
            </div>

            <div class="form-group">
                <textarea class="ph" name="description" rows="4" placeholder="توضیحات مربوط به محصول را وارد کنید" ></textarea>
            </div>

            <button type="submit" class="button">ثبت محصول اصلی</button>
        </form>
    </div>


    <table class="category-table">

        <thead>
            <tr>
                <th>شناسه</th>
                <th>نام دسته اصلی</th>
                <th>توضیحات</th>
                <th>عملیات</th>
            </tr>
        </thead>

        <tbody>

            {% for category in categories %}

            <tr>
                <td>{{ category.id }}</td>

                <td>{{ category.name }}</td>

                <td>{{ category.description }}</td>

                <td>
                    <button class="edit-btn">ویرایش</button>
                    <button class="delete-btn">حذف</button>
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>
</body>

</html>
